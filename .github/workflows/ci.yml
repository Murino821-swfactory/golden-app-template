name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      reused: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify CI evidence handling
        run: node --test scripts/ci-proof.test.mjs
      - name: Mark this exact PR tree pending
        if: github.event_name == 'pull_request'
        run: node scripts/ci-proof.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PROOF_STATE: pending
      - id: verified
        name: Reuse the exact PR-tested tree on main
        if: github.event_name == 'push'
        run: node scripts/ci-pr-verified.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  # Static checks run once — they do not depend on which config is in place.
  quality:
    needs: plan
    if: needs.plan.outputs.reused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # @tokenwise/shared-ui: font files, generated styles.css, no auth/i18n/network imports.
      - name: Shared UI package tests
        run: npm run test:packages

      # The committed schema is the harness's copy of this repo's contract. A stale one
      # would have the assembly line ask for a shape this repo no longer accepts.
      - name: Schema is in sync with the code
        run: |
          npm run schema
          git diff --exit-code prototype.schema.json

  # Every change to what @tokenwise/shared-ui ships has to reach npm, or tokenwise.sk keeps
  # rendering the old header while every new prototype renders the new one. publish.yml
  # publishes only a version npm does not have yet, so an unbumped change would be merged
  # and never released.
  shared-ui-version:
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A change to the package bumps its version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- packages/shared-ui/src packages/shared-ui/styles.css packages/shared-ui/fonts)
          if [ -z "$changed" ]; then
            echo "packages/shared-ui unchanged"
            exit 0
          fi
          before=$(git show "$BASE:packages/shared-ui/package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("")}})')
          after=$(node -p 'require("./packages/shared-ui/package.json").version')
          if [ "$before" = "$after" ]; then
            echo "::error::packages/shared-ui changed but its version is still $after — bump packages/shared-ui/package.json (and src/version.ts)."
            echo "$changed"
            exit 1
          fi
          echo "shared-ui $before -> $after"

  # A prototype differs from this repo ONLY by prototype.config.json. Building just the
  # shipped config would prove nothing about the configs a customer can actually pick, so
  # every one of them is built and tested here. This job IS the promise the assembly line
  # makes: if it is green, a prototype cannot fail the build gate on its own config.
  build:
    needs: plan
    if: needs.plan.outputs.reused != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `full` and `multilingual` both declare two locales, so both exercise locale routing.
        config: [default, minimal, full, composed, multilingual]
    env:
      # Which config is actually on disk for this job. `composed-config.spec.ts` reads it to
      # skip the "what gets published" rule in jobs that swapped a fixture in — `full` uses
      # locked sections deliberately. Unset outside this matrix, which is what lets the same
      # rule guard a customer's config when the factory runs this suite as its smoke gate.
      PROTOTYPE_CONFIG_FIXTURE: ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select config
        run: node scripts/use-config.mjs ${{ matrix.config }}

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Tests run against the static export in out/ — what actually gets deployed —
      # not against a dev server.
      - name: Run E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.config }}
          path: playwright-report/
          retention-days: 7

  ci-result:
    name: CI result
    needs: [plan, quality, shared-ui-version, build]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require the planned checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module -e '
          const n = JSON.parse(process.env.RESULTS);
          if (n.plan.result !== "success") throw new Error("Plan failed");
          const reused = n.plan.outputs.reused === "true";
          for (const k of ["quality", "build"]) {
            if (n[k].result !== (reused ? "skipped" : "success")) throw new Error(k + " failed or skipped unexpectedly");
          }
          if (n["shared-ui-version"].result !== (process.env.EVENT === "pull_request" ? "success" : "skipped")) throw new Error("Package version check failed");'
      - name: Persist exact-tree verification
        if: always() && github.event_name == 'pull_request'
        run: node scripts/ci-proof.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PROOF_STATE: ${{ job.status == 'success' && 'success' || 'failed' }}
