name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Static checks run once — they do not depend on which config is in place.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # @tokenwise/shared-ui: font files, generated styles.css, no auth/i18n/network imports.
      - name: Shared UI package tests
        run: npm run test:packages

      # The committed schema is the harness's copy of this repo's contract. A stale one
      # would have the assembly line ask for a shape this repo no longer accepts.
      - name: Schema is in sync with the code
        run: |
          npm run schema
          git diff --exit-code prototype.schema.json

  # Every change to what @tokenwise/shared-ui ships has to reach npm, or tokenwise.sk keeps
  # rendering the old header while every new prototype renders the new one. publish.yml
  # publishes only a version npm does not have yet, so an unbumped change would be merged
  # and never released.
  shared-ui-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A change to the package bumps its version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- packages/shared-ui/src packages/shared-ui/styles.css packages/shared-ui/fonts)
          if [ -z "$changed" ]; then
            echo "packages/shared-ui unchanged"
            exit 0
          fi
          before=$(git show "$BASE:packages/shared-ui/package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("")}})')
          after=$(node -p 'require("./packages/shared-ui/package.json").version')
          if [ "$before" = "$after" ]; then
            echo "::error::packages/shared-ui changed but its version is still $after — bump packages/shared-ui/package.json (and src/version.ts)."
            echo "$changed"
            exit 1
          fi
          echo "shared-ui $before -> $after"

  # A prototype differs from this repo ONLY by prototype.config.json. Building just the
  # shipped config would prove nothing about the configs a customer can actually pick, so
  # every one of them is built and tested here. This job IS the promise the assembly line
  # makes: if it is green, a prototype cannot fail the build gate on its own config.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `full` and `multilingual` both declare two locales, so both exercise locale routing.
        config: [default, minimal, full, composed, multilingual]
    env:
      # Which config is actually on disk for this job. `composed-config.spec.ts` reads it to
      # skip the "what gets published" rule in jobs that swapped a fixture in — `full` uses
      # locked sections deliberately. Unset outside this matrix, which is what lets the same
      # rule guard a customer's config when the factory runs this suite as its smoke gate.
      PROTOTYPE_CONFIG_FIXTURE: ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select config
        run: node scripts/use-config.mjs ${{ matrix.config }}

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Tests run against the static export in out/ — what actually gets deployed —
      # not against a dev server.
      - name: Run E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.config }}
          path: playwright-report/
          retention-days: 7
