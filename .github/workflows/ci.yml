name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Static checks run once — they do not depend on which config is in place.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The committed schema is the harness's copy of this repo's contract. A stale one
      # would have the assembly line ask for a shape this repo no longer accepts.
      - name: Schema is in sync with the code
        run: |
          npm run schema
          git diff --exit-code prototype.schema.json

  # A prototype differs from this repo ONLY by prototype.config.json. Building just the
  # shipped config would prove nothing about the configs a customer can actually pick, so
  # every one of them is built and tested here. This job IS the promise the assembly line
  # makes: if it is green, a prototype cannot fail the build gate on its own config.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [default, minimal, full, demo]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select config
        run: node scripts/use-config.mjs ${{ matrix.config }}

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Tests run against the static export in out/ — what actually gets deployed —
      # not against a dev server.
      - name: Run E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.config }}
          path: playwright-report/
          retention-days: 7
